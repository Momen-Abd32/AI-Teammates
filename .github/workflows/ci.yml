name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @ai-teammates/api lint

      - name: Test API
        run: pnpm --filter @ai-teammates/api test

      - name: Typecheck web
        run: pnpm --filter @ai-teammates/web lint

      - name: Typecheck desktop agent
        run: pnpm --filter @ai-teammates/desktop-agent build

      - name: Build API
        run: pnpm --filter @ai-teammates/api build

      - name: Build web
        run: pnpm --filter @ai-teammates/web build

      - name: Python syntax check
        run: |
          python -m compileall apps/agent-service/app
          python -m compileall apps/sandbox-worker

      - name: Test agent service providers
        run: PYTHONPATH=apps/agent-service python -m unittest discover -s apps/agent-service/tests -p 'test_*.py'

      - name: Validate Docker Compose
        run: AUTH_SECRET=ci-validation-secret docker compose config
