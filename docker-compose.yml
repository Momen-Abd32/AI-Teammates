services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ai_teammates
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data,./infrastructure/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
  agent-service:
    build: ./apps/agent-service
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis,postgres]
    ports: ["8000:8000"]
  agent-worker:
    build: ./apps/agent-service
    command: ["python","-m","app.worker"]
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_STREAM: agent:tasks
      REDIS_RESPONSE_STREAM: agent:responses
      REDIS_GROUP: agent-runtime
    depends_on: [redis,agent-service]
  sandbox-worker:
    build: ./apps/sandbox-worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_teammates
      REDIS_URL: redis://redis:6379
      AGENT_SERVICE_URL: http://agent-service:8000
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      SANDBOX_WORKER_URL: http://sandbox-worker:8010
    depends_on: [postgres,redis,agent-service,agent-worker,sandbox-worker]
    ports: ["3001:3001"]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  postgres_data:
  redis_data:
